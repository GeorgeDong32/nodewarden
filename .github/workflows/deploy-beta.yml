name: Verify and deploy vault beta

on:
  push:
    branches: [fix/vault-security]
  pull_request:
    branches: [fix/vault-security]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a deployment already in progress.
concurrency:
  group: vault-beta-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    name: Tests, types and Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify:ci

  deploy:
    name: Deploy vault-beta.georgedong.tech
    needs: verify
    if: >-
      github.repository == 'GeorgeDong32/nodewarden' &&
      github.ref == 'refs/heads/fix/vault-security' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: vault-beta
      url: https://vault-beta.georgedong.tech
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
          package-manager-cache: false
      - run: npm ci
      # A re-run of an older workflow must not roll back the live Worker.
      - name: Check that this is still the branch tip
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/fix/vault-security" --jq '.object.sha')
          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit exists; skipping this deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy using the existing Cloudflare resources and secrets
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in Actions secrets and CLOUDFLARE_ACCOUNT_ID in Actions variables (or secrets)."
            exit 1
          fi
          npm run deploy:ci
